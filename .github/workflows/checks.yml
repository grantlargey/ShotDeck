name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: scriptdeck_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d scriptdeck_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24.13.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Check unused code and dependencies
        run: npm run check:unused

      - name: Lint client
        run: npm run lint --prefix client

      - name: Test client
        run: npm test --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Lint server
        run: npm run lint --prefix server

      - name: Test server
        run: npm test --prefix server
        env:
          DATABASE_URL: postgres://app:app@127.0.0.1:5432/scriptdeck_test_ci
